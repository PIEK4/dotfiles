# main mod
$mod = SUPER
$left = n
$right = i
$up = u
$down = e

# submap - main
exec-once = hyprctl dispatch submap main
bindu = $mod, escape, submap, main
submap = main

# submap - apps
bind = $mod, A, submap, apps
submap = apps, main
  bind =, C, killactive
  bind =, M, exec, $menu
  bind =, T, exec, $terminal
  bind =, B, exec, $browser
  bind =, F, exec, $file
  bind =, E, exec, $text
submap = main

# submap - window managment
bind = $mod, M, submap, manage
submap = manage
  bind =, F, togglefloating,
  # small resize
  binde = CONTROL, $left, layoutmsg, colresize -0.2
  binde = CONTROL, $right, layoutmsg, colresize +0.2
  # resize based on 'explicit_column_widths'
  binde = SHIFT, $left, layoutmsg, colresize -conf
  binde = SHIFT, $right, layoutmsg, colresize +conf
submap = main

# exits hyprland
bind = $mod, L, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

# move focus
bindu = $mod, $left, layoutmsg, focus l
bindu = $mod, $right, layoutmsg, focus r
bindu = $mod, $up, movefocus, u
bindu = $mod, $down, movefocus, d

# switch workspaces
bindu = $mod, 1, workspace, 1
bindu = $mod, 2, workspace, 2
bindu = $mod, 3, workspace, 3
bindu = $mod, 4, workspace, 4
bindu = $mod, 5, workspace, 5
bindu = $mod, 6, workspace, 6
bindu = $mod, 7, workspace, 7
bindu = $mod, 8, workspace, 8
bindu = $mod, 9, workspace, 9
bindu = $mod, 0, workspace, 10

# move windows
bind = $mod SHIFT, $left, layoutmsg, movewindowto l
bind = $mod SHIFT, $right, layoutmsg, movewindowto r
bind = $mod SHIFT, $up, layoutmsg, movewindowto u
bind = $mod SHIFT, $down, layoutmsg, movewindowto d 

# pormote columns
bind = $mod CONTROL, $up, layoutmsg, promote
bind = $mod CONTROL, $left, layoutmsg, swapcol l
bind = $mod CONTROL, $right, layoutmsg, swapcol r

# move windows to workspaces
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# mouse move window with Super + LMB & resize window with Super +RMP
bindmu = $mod, mouse:272, movewindow
bindmu = $mod, mouse:273, resizewindow

# Example special workspace (scratchpad)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Laptop multimedia keys for volume and LCD brightness
bindelu = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindelu = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindelu = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindelu = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindelu = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindelu = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# multimedia keyr for player
bindlu = , XF86AudioNext, exec, playerctl next
bindlu = , XF86AudioPause, exec, playerctl play-pause
bindlu = , XF86AudioPlay, exec, playerctl play-pause
bindlu = , XF86AudioPrev, exec, playerctl previous

